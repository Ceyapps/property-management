version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rbacbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rbacbase
      POSTGRES_USER: rbacuser
      POSTGRES_PASSWORD: rbacpassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - rbacbase-network

  adminer:
    image: adminer:latest
    container_name: rbacbase-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - rbacbase-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  rbacbase-network:
    driver: bridge
